<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="OINK">
  <title>OINK</title>
  <!--
    Default featured image. Drawn as geometry rather than <text>: an SVG loaded
    through <img> cannot reach the page's webfonts, so a text wordmark would
    render in whatever the reader's system supplies. Colours follow the theme
    tokens, and the whole thing flips with the reader's color scheme.
  -->
  <style>
    .bg { fill: #f1f4f8; }
    .grid { stroke: #304a69; stroke-opacity: 0.09; stroke-width: 1; }
    .mark { stroke: #2f6793; }
    .accent { fill: #b4762e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1119; }
      .grid { stroke: #93a3b8; stroke-opacity: 0.1; }
      .mark { stroke: #6ea8dc; }
      .accent { fill: #e0a35c; }
    }
  </style>

  <rect class="bg" width="1200" height="600"/>

  <!-- Grid motif, the same one the landing hero sits on. -->
  <g class="grid">
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600M800 0V600M900 0V600M1000 0V600M1100 0V600"/>
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/>
  </g>

  <!-- OINK -->
  <g class="mark" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="411" y="251" width="68" height="98" rx="34"/>
    <path d="M541 251V349"/>
    <path d="M603 349V251L671 349V251"/>
    <path d="M733 251V349M801 251L733 300L801 349"/>
  </g>

  <!-- Copper full stop, echoing the wordmark's accent letter. -->
  <circle class="accent" cx="838" cy="338" r="12"/>
</svg>
