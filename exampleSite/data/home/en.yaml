# OINK composes the homepage in exactly this order. Remove, reorder, or disable
# any entry without changing a template. A map entry can point at a differently
# named data block with `key`, which also allows multiple instances of one type.
sections:
  - hero
  - metrics
  - capabilities
  - cards
  - type: logo_wall
    key: ecosystem
  - gallery
  - testimonials
  - contributors
  - faq
  - markdown
  - principles
  - cta

hero:
  eyebrow: Composable · Local-first · Hugo-only
  title: Build **clearer** documentation.
  desc: OINK turns `data/home.yaml` into a landing page. Ordinary text fields support [Markdown links](https://gohugo.io/content-management/data-sources/).
  note: No npm, CDN, or JavaScript framework required.
  actions:
    - label: Read the docs
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: View on GitHub
      url: https://github.com/pgsty/oink
      icon: fa-brands fa-github
      style: ghost
      external: true

metrics:
  eyebrow: At a glance
  title: Small surface, broad reach
  desc: Metrics accept optional links and supporting text.
  columns: 4
  items:
    - { value: 12, label: Section types, icon: fa-solid fa-layer-group }
    - { value: 1, label: Data file, icon: fa-solid fa-file-code }
    - { value: 0, label: Runtime dependencies, icon: fa-solid fa-plug }
    - { value: 100%, label: Hugo-rendered, icon: fa-solid fa-bolt }

capabilities:
  eyebrow: Existing specialist section
  title: Keep the expressive layouts
  desc: Complex feature rows remain configurable alongside the new generic sections.
  items:
    - ref: 01 / SECTION DISPATCH
      title: Reorder without editing HTML
      url: https://gohugo.io/templates/partial/
      external: true
      motto: A small dispatcher, independent partials
      bullets:
        - Put Section names in the `sections` array.
        - Use `key` to reuse one type with different data.
        - 'Set `enabled: false` for temporary removal.'
      value: Structure is data now, not a hard-coded template.
      visual:
        type: code
        title: data/home.yaml
        aria_label: Landing page section configuration
        lines:
          - { class: c, prefix: '# ', text: compose the page }
          - { class: p, prefix: '- ', text: hero }
          - { class: ok, prefix: '- ', text: logo_wall }
          - { class: ok, prefix: '- ', text: faq }

cards:
  eyebrow: Generic cards
  title: Configure the common case
  desc: Use cards for features, benefits, services, or any short collection.
  columns: 3
  link_label: Learn more
  items:
    - name: Markdown-aware
      icon: fa-brands fa-markdown
      meta: Rich text
      desc: Descriptions can contain **emphasis**, `code`, and [links](https://commonmark.org/).
      url: https://commonmark.org/
      external: true
    - name: Link-optional
      icon: fa-solid fa-link-slash
      meta: Robust data
      desc: Leave out `url` and the card remains valid, readable content.
    - name: Reusable
      icon: fa-solid fa-repeat
      meta: Multiple instances
      desc: Point two Section entries at different keys with the same `type`.

ecosystem:
  eyebrow: Logo wall
  title: Works with familiar tools
  desc: '`icon` accepts a Font Awesome class, an image path, or a simple symbol.'
  columns: 4
  items:
    - { name: Hugo, desc: Static site generator, icon: fa-solid fa-bolt, url: https://gohugo.io/, external: true }
    - { name: Markdown, desc: Content format, icon: fa-brands fa-markdown, url: https://commonmark.org/, external: true }
    - { name: Git, desc: Version control, icon: fa-brands fa-git-alt }
    - { name: Offline, desc: Everything local, icon: ◉ }

gallery:
  eyebrow: Gallery
  title: Showcase pages, products, or examples
  desc: Supply screenshots through `image`, or use icons while the artwork is still being prepared.
  columns: 3
  link_label: Open example
  items:
    - title: Documentation portal
      badge: Information architecture
      icon: fa-solid fa-book
      desc: Present a focused route into the [documentation](docs/).
      url: docs/
    - title: API reference
      badge: OpenAPI
      icon: fa-solid fa-code
      desc: Pair prose with generated reference material.
    - title: Engineering blog
      badge: Updates
      icon: fa-solid fa-newspaper
      desc: Publish releases, explanations, and decisions.

testimonials:
  eyebrow: Comment wall
  title: Let users speak
  desc: Each quote supports a name, avatar or icon, role, source URL, and Markdown comment.
  columns: 2
  items:
    - name: Ada Example
      icon: A
      desc: Documentation engineer
      comment: “The configuration is readable enough that **content owners** can change the homepage themselves.”
      source: Source
      url: https://example.org/
      external: true
    - name: Lin Example
      icon: L
      desc: Open-source maintainer
      comment: “We reordered the Gallery and FAQ with a two-line YAML change.”

contributors:
  eyebrow: Contributors
  title: Credit the people behind the work
  desc: Use image paths for avatars in production; symbols keep this example self-contained.
  columns: 3
  items:
    - { name: Alex, icon: A, desc: Theme architecture, url: https://github.com/ }
    - { name: Bo, icon: B, desc: Accessibility review }
    - { name: Casey, icon: C, desc: Documentation and examples }

faq:
  eyebrow: FAQ
  title: Common questions
  desc: Answers use block Markdown, so lists and multiple paragraphs work as expected.
  items:
    - question: Can I use one `data/home.yaml` file?
      answer: Yes. Single-language sites can use one file; multilingual sites can use `data/home/en.yaml`, `data/home/zh.yaml`, and so on.
      open: true
    - question: Can I repeat a Section type?
      answer: |
        Yes. Give each entry a different `key`:

        - `{ type: gallery, key: products }`
        - `{ type: gallery, key: case_studies }`
    - question: What happens when `url` is missing?
      answer: The item renders as normal content without an empty or broken link.

markdown:
  eyebrow: Free-form Markdown
  title: An escape hatch for unique content
  desc: Use the Markdown Section when a predefined collection is unnecessary.
  body: |
    This entire block is rendered from data. It supports paragraphs, [links](https://gohugo.io/), and lists:

    - no custom template required;
    - regular Goldmark rendering;
    - the same landing-page width and visual rhythm.

principles:
  eyebrow: Principles
  title: Predictable by design
  columns: 3
  items:
    - icon: fa-solid fa-sliders
      title: Content first
      desc: Most changes are plain text in YAML.
    - icon: fa-solid fa-universal-access
      title: Accessible defaults
      desc: Semantic sections, guarded links, and native FAQ disclosure controls.
    - icon: fa-solid fa-code-branch
      title: Backward compatible
      desc: Existing home data keeps its previous order when `sections` is absent.

cta:
  title: Assemble your landing page.
  desc: Copy this file, replace the sample content, and reorder the Section list.
  label: Get started
  url: docs/
  style: primary
