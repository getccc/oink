<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="growth-orbit-title growth-orbit-desc">
  <title id="growth-orbit-title">成长轨道</title>
  <desc id="growth-orbit-desc">AI、财富与人生三条轨道围绕长期主义核心相互连接</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop stop-color="#24385b"/>
      <stop offset="1" stop-color="#0c1422"/>
    </radialGradient>
    <linearGradient id="orbit" x1="110" y1="60" x2="620" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a7dff"/>
      <stop offset="0.5" stop-color="#28c2b8"/>
      <stop offset="1" stop-color="#f2c45c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="720" height="560" rx="32" fill="url(#bg)"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="3" opacity=".82">
    <ellipse cx="360" cy="280" rx="238" ry="104" transform="rotate(-18 360 280)"/>
    <ellipse cx="360" cy="280" rx="238" ry="104" transform="rotate(42 360 280)"/>
    <ellipse cx="360" cy="280" rx="238" ry="104" transform="rotate(102 360 280)"/>
  </g>
  <circle cx="360" cy="280" r="72" fill="#101b2c" stroke="url(#orbit)" stroke-width="3"/>
  <circle cx="360" cy="280" r="44" fill="#1b2a42"/>
  <circle cx="360" cy="280" r="18" fill="#f2c45c" filter="url(#glow)" opacity=".7"/>
  <circle cx="360" cy="280" r="10" fill="#fff4ce"/>
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <g transform="translate(174 150)"><circle r="38" fill="#171f38" stroke="#8a7dff" stroke-width="3"/><text y="8" fill="#cfcaff">AI</text></g>
    <g transform="translate(562 222)"><circle r="38" fill="#102b2d" stroke="#28c2b8" stroke-width="3"/><text y="8" fill="#a9f1ea">财富</text></g>
    <g transform="translate(308 468)"><circle r="38" fill="#332a18" stroke="#f2c45c" stroke-width="3"/><text y="8" fill="#ffe5a1">人生</text></g>
  </g>
  <g fill="#c9d5e8" font-family="system-ui, sans-serif" font-size="16" letter-spacing="4" text-anchor="middle">
    <text x="360" y="265">THINK · BUILD</text>
    <text x="360" y="305">COMPOUND</text>
  </g>
</svg>
