{{- /* Place nested cards in an accessible carousel. Optional: label. */ -}}
{{- $id := printf "td-carousel-%s-%d" (md5 .Page.RelPermalink) .Ordinal -}}
{{- .Page.Store.Set "hasDocCarousel" true -}}
<section id="{{ $id }}" class="td-doc-carousel" data-td-carousel role="region"
  aria-roledescription="carousel" aria-label="{{ .Get "label" | default (T "ui_doc_carousel") }}">
  <button class="td-doc-carousel__button" type="button" data-td-carousel-action="previous"
    aria-controls="{{ $id }}-track" aria-label="{{ T "ui_carousel_previous" }}">‹</button>
  <div id="{{ $id }}-track" class="td-doc-carousel__track" data-td-carousel-track tabindex="0">
    {{- .Inner -}}
  </div>
  <button class="td-doc-carousel__button" type="button" data-td-carousel-action="next"
    aria-controls="{{ $id }}-track" aria-label="{{ T "ui_carousel_next" }}">›</button>
</section>
